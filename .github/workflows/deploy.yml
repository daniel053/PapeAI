# Deploy to Cloudflare Workers (static assets only), two separate Workers:
#   papeai-app  (app/wrangler.jsonc)  — the PWA, non-indexable, strict CSP
#   papeai-site (site/wrangler.jsonc) — the public site
# - push to main      -> production (`wrangler deploy`)
# - pull request      -> one isolated Preview per PR (`wrangler preview --name pr-<number>`)
# - pull request closed -> the Preview is deleted
#
# While the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets do not exist (or for PRs from
# forks and Dependabot, which do not receive them) every deploy step is skipped with a notice and
# the job still succeeds.
#
# Security design: the `build` job runs project code and npm packages but never sees Cloudflare
# secrets. Deploy jobs never check out or install the project: they only download the built files
# plus wrangler.jsonc and run Wrangler (pinned exact version) through Cloudflare's official action.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a production deploy halfway; superseded PR previews can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Workers Previews need Wrangler >= 4.136.3 (cloudflare/wrangler-action README, v4.1.3).
  # Exact version so the deploy is reproducible; Dependabot does not update this line.
  WRANGLER_VERSION: '4.168.0'

jobs:
  build:
    name: deploy-build
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          cache: 'false' # no shared cache in the deploy pipeline (cache-poisoning hardening)
      - name: Build app and site
        run: pnpm build
      - name: Assemble deploy bundle (only wrangler.jsonc + dist per Worker)
        run: |
          for p in app site; do
            mkdir -p "bundle/$p"
            cp "$p/wrangler.jsonc" "bundle/$p/wrangler.jsonc"
            cp -R "$p/dist" "bundle/$p/dist"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 3
          # Needed for dist/.well-known/security.txt (hidden folders are skipped by default).
          include-hidden-files: true

  production:
    name: deploy-production (${{ matrix.project }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    strategy:
      fail-fast: false
      matrix:
        project: [app, site]
    steps:
      - name: Check Cloudflare secrets
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not configured. See docs/processo/git-github-e-ci.md."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: deploy-bundle
          path: bundle
      - name: Deploy to production
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: bundle/${{ matrix.project }}
          command: deploy
      - name: Summary
        if: steps.gate.outputs.enabled == 'true'
        env:
          PROJECT: ${{ matrix.project }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Production ($PROJECT): $URL" >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: deploy-preview (${{ matrix.project }})
    # Same-repository PRs only: fork PRs never get secrets.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # comment the preview URL on the PR
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    strategy:
      fail-fast: false
      matrix:
        project: [app, site]
    steps:
      - name: Check Cloudflare secrets
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview skipped::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not configured. See docs/processo/git-github-e-ci.md."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: deploy-bundle
          path: bundle
      - name: Deploy preview
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: bundle/${{ matrix.project }}
          command: preview --name pr-${{ github.event.pull_request.number }}
      - name: Comment preview URL on the PR (one comment per Worker, updated on each push)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- papeai-preview:$PROJECT -->"
          body="$marker
          **Preview \`$PROJECT\`:** $URL
          Commit: \`$SHA\`"
          echo "### Preview ($PROJECT): $URL" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  preview-cleanup:
    name: deploy-preview-cleanup (${{ matrix.project }})
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    strategy:
      fail-fast: false
      matrix:
        project: [app, site]
    steps:
      - name: Check Cloudflare secrets
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cleanup skipped::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not configured."
          fi
      # Only the Wrangler config is needed (it names the Worker); no project code is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
          sparse-checkout: ${{ matrix.project }}/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - name: Delete preview
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: ${{ matrix.project }}
          command: preview delete --name pr-${{ github.event.pull_request.number }} --skip-confirmation
