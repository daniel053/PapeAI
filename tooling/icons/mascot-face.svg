<?xml version="1.0" encoding="UTF-8"?>
<!--
  Master artwork for the placeholder app icon: the marmoset face from
  app/src/mascot/MascotPlaceholder.tsx (keep both in sync).
  Edit this file, then run `pnpm --filter ./app icons` to regenerate
  app/public/favicon.svg and app/public/icons/*.png.
  The generator only understands <circle>, <ellipse> and stroked <path>
  (absolute M/L/Q commands, round caps). Anything else makes it fail.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- White ear tufts, typical of the common marmoset -->
  <ellipse cx="38" cy="92" rx="30" ry="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <ellipse cx="162" cy="92" rx="30" ry="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Head -->
  <circle cx="100" cy="105" r="62" fill="#6b5b4d"/>
  <!-- Face -->
  <ellipse cx="100" cy="120" rx="42" ry="40" fill="#e7d3bd"/>
  <!-- White forehead blaze -->
  <ellipse cx="100" cy="66" rx="10" ry="8" fill="#f8fafc"/>
  <!-- Eyes -->
  <circle cx="82" cy="112" r="9" fill="#0f172a"/>
  <circle cx="118" cy="112" r="9" fill="#0f172a"/>
  <circle cx="85" cy="109" r="3" fill="#ffffff"/>
  <circle cx="121" cy="109" r="3" fill="#ffffff"/>
  <!-- Nose and smile -->
  <ellipse cx="100" cy="130" rx="5" ry="3.5" fill="#4b3f35"/>
  <path d="M88 142 Q100 152 112 142" fill="none" stroke="#4b3f35" stroke-width="3" stroke-linecap="round"/>
</svg>
