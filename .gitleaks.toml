# gitleaks configuration for PapeAI (used by CI job `secrets` and tooling/git-hooks/pre-commit).
# Syntax verified against the gitleaks v8.30.1 README (2026-11-26).
title = "PapeAI gitleaks config"

# Keep every default rule (it already has `anthropic-api-key` for sk-ant-api03-... and
# `anthropic-admin-api-key` for sk-ant-admin01-..., both with the exact official length).
[extend]
useDefault = true

# Broader safety net: anything that starts with the Anthropic prefix and looks like a key,
# whatever the middle part or length (other key types, truncated pastes, future formats).
[[rules]]
id = "papeai-anthropic-key-any"
description = "Anthropic-style key (sk-ant- prefix, any variant). The learner's key must never be committed."
regex = '''\b(sk-ant-[A-Za-z0-9_\-]{20,})'''
secretGroup = 1
keywords = ["sk-ant-"]
tags = ["anthropic", "byok"]

# Test fixtures may use OBVIOUSLY fake keys. A finding is ignored only when BOTH are true:
#   - the file is a test/fixture file, and
#   - the secret contains the marker FAKE (e.g. sk-ant-api03-FAKE...).
# Real-looking keys in tests are still reported.
[[allowlists]]
description = "Obviously fake keys (marker FAKE) in test files"
condition = "AND"
paths = ['''(^|/)(tests?|__tests__|fixtures?|__fixtures__)/|\.(test|spec)\.[cm]?[jt]sx?$''']
regexes = ['''FAKE''']
